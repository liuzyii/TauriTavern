# Build Android APK for the TauriTavern fork
#
# This workflow mirrors the upstream Android build chain from
# canary-release.yml (tauri-apps/tauri-action@v1 + the repo's own
# scripts/tauri-app.mjs wrapper + the same --apk --split-per-abi --target
# args), with only two fork-specific adjustments:
#   1. No `prepare` job (upstream needs a Canary tag + an existing latest
#      release, which a fresh fork does not have).
#   2. Signing uses a throwaway CI keystore instead of ANDROID_KEY_* secrets,
#      so the workflow runs with zero secrets. (build.gradle.kts reads
#      keystore.properties unconditionally; without it ANY build fails with
#      "null cannot be cast to non-null type kotlin.String".)
#   3. arm64-only: builds aarch64 (arm64-v8a) only, no 32-bit device support
#      (--target aarch64), which halves Rust cross-compile time.
#
# Triggers: push to main, or manual via Actions -> "Build Android APK".

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Android signing (release key, throwaway fallback)
        shell: bash
        run: |
          cd src-tauri/crates/tauritavern/gen/android
          if [ -n "${{ secrets.ANDROID_KEY_BASE64 }}" ]; then
            echo "Using release keystore from ANDROID_KEY_* secrets"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
            base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            # fail fast: verify the secret combination (keystore file, password,
            # alias) before the 10-minute build. keytool errors name the problem.
            keytool -list -keystore "$RUNNER_TEMP/keystore.jks" -storetype PKCS12 \
              -storepass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null 2>&1 \
              || { echo "KEYSTORE VERIFICATION FAILED: check ANDROID_KEY_BASE64/ANDROID_KEY_PASSWORD/ANDROID_KEY_ALIAS"; exit 1; }
            echo "Release keystore verified OK"
          else
            echo "No ANDROID_KEY_* secrets yet - using throwaway CI keystore"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias tauri -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tauritavern -keypass tauritavern \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=CN" 2>/dev/null
            {
              echo "keyAlias=tauri"
              echo "password=tauritavern"
              echo "storeFile=$RUNNER_TEMP/keystore.jks"
            } > keystore.properties
          fi

      - name: Enable HTTP access for mobile
        run: ./scripts/ci/configure-mobile-http.sh enable android

      - name: Build APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # monotonic per-workflow counter -> Android versionCode increases on
          # every build, so each APK installs over the previous one (same
          # signature required; see signing step).
          TAURITAVERN_VERSION_CODE: ${{ github.run_number }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: android
          args: --verbose --apk --split-per-abi --target aarch64
          uploadWorkflowArtifacts: true
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ github.run_number }}-apk-[arch]-[bundle]'
